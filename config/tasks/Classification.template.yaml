# yaml-language-server: $schema=none
# ↑ 이 폴더 이름이 "tasks" 라서, VSCode 의 Ansible 확장이 파일 경로만 보고 Ansible
#   태스크 목록 스키마를 잘못 붙인다(Ansible 과 무관한 파일이다). 이 한 줄로 그 스키마
#   검사를 파일 단위로 끈다 - .vscode/settings.json 의 files.associations 와 별개로,
#   에디터/워크스페이스 설정 없이도 이 파일만 열면 항상 적용된다.
# Task: Classification
# options = combo-box choices · metrics = table metric columns · columns = table layout
# short   = short name used in the generated command ({task_short})
# See the header of options.yaml for the full syntax.

name: Classification
label: Image Classification
options:
  model: [ResNet-50, ViT-B/16, ConvNeXt-T, Swin-T]
  dataset: [ImageNet-1k, CIFAR-100, Food-101]
metrics:
- {key: Top-1, unit: '%', digits: 2, higher_is_better: true}
- {key: Top-5, unit: '%', digits: 2, higher_is_better: true}
columns:
  train: [status, server, gpus, model, dataset, duration, Top-1, Top-5, result_path]
  evaluation: [status, server, model, checkpoint_path, dataset, latency_ms, throughput_fps, Top-1, Top-5, result_path]
commands:
  train: python train.py algo={task_short}/{algo} data={task_short}/{dataset} model={task_short}/{model} <batch_size> <crop_size> <lr> <epochs>
  evaluation: python evaluate.py algo={task_short}/{algo} data={task_short}/{dataset} model={task_short}/{model} <checkpoint_path> <checkpoint_epoch> <result_path>
