# Task: SR
# options = combo-box choices · metrics = table metric columns · columns = table layout
# See the header of options.yaml for the full syntax.

name: SR
label: Super Resolution
options:
  model: [Restormer, SwinIR, MambaIR, HAT, EDSR, RCAN]
  dataset: [DIV2K, DF2K, Flickr2K, Set5, Set14, Urban100]
  scale: [x2, x3, x4]
metrics:
- {key: PSNR, unit: dB, digits: 2, higher_is_better: true}
- {key: SSIM, digits: 4, higher_is_better: true}
- {key: LPIPS, digits: 3, higher_is_better: false}
columns:
  train: [status, server, gpus, model, dataset, scale, duration, PSNR, SSIM, LPIPS, result_path]
  evaluation: [status, server, gpus, model, checkpoint_path, dataset, latency_ms, throughput_fps, PSNR, SSIM, LPIPS, result_path]
commands:
  train: python train.py algo={task_lower}/{algo} data={task_lower}/{dataset} model={task_lower}/{model} +batch_size={batch_size} +crop_size={crop_size} +lr={lr} +max_epoch={epochs}
  evaluation: python evaluate.py algo={task_lower}/{algo} data={task_lower}/{dataset} model={task_lower}/{model} +ckpt_path={checkpoint_path} +epoch={checkpoint_epoch} +out_dir={result_path}
