# yaml-language-server: $schema=none
# ↑ 폴더 이름을 tasks -> task-defs 로 바꿔서 Ansible 확장의 오탐은 근본적으로
#   없앴지만, 혹시 다른 도구가 같은 식으로(경로만 보고) 스키마를 잘못 붙이는 걸
#   대비한 안전망이다. 파일 자체에 붙어 있어 워크스페이스 설정과 무관하게 적용된다.
# Task: Denoising
# options = combo-box choices · metrics = table metric columns · columns = table layout
# short   = short name used in the generated command ({task_short})
# See the header of options.yaml for the full syntax.

name: Denoising
label: Denoising
short: dn
options:
  model: [Restormer, NAFNet, SCUNet, Uformer]
  dataset: [SIDD, DND, BSD68, Kodak24]
  noise_sigma: ['15', '25', '50']
  algo: [noise2noise]
metrics:
- {key: PSNR, unit: dB, digits: 2, higher_is_better: true}
- {key: SSIM, digits: 4, higher_is_better: true}
columns:
  train: [status, server, gpus, model, dataset, noise_sigma, duration, PSNR, SSIM, result_path]
  evaluation: [status, server, gpus, model, checkpoint_path, dataset, noise_sigma, latency_ms, PSNR, SSIM, result_path]
commands:
  train: python train.py algo={task_short}/{algo} data={task_short}/{dataset} model={task_short}/{model} <batch_size> <crop_size> <lr> <epochs>
  evaluation: python evaluate.py algo={task_short}/{algo} data={task_short}/{dataset} model={task_short}/{model} <checkpoint_path> <checkpoint_epoch> <result_path>
