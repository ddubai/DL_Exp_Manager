# 서버 & GPU 인벤토리
# 여기 적은 GPU 가 등록 폼의 체크박스이자 상단 서버 상태 패널의 슬롯이 됩니다.
#   index = CUDA_VISIBLE_DEVICES 번호 · type = V100 / H100 / A100 … · memory_gb = 참고용

servers:
- name: Server 1
  host: 192.168.0.101
  gpus:
  - {index: 0, type: H100, memory_gb: 80}
  - {index: 1, type: H100, memory_gb: 80}
  - {index: 2, type: H100, memory_gb: 80}
  - {index: 3, type: H100, memory_gb: 80}
